name: Release

on:
    release:
        types: [published]

jobs:
    build-and-release:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '24'
                cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run build
              run: npm run build
            - name: Upload release assets
              uses: softprops/action-gh-release@v1
              with:
                files: |
                  ./dist/worker.min.js
                  ./dist/worker.js
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
